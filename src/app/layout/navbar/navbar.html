<header
  class="fixed inset-x-0 top-0 z-50 border-b border-transparent backdrop-blur-xl transition-[background-color,border-color,box-shadow] duration-300"
  [class]="scrolled() ? 'bg-bg/80 border-white/5 shadow-lg shadow-black/20' : 'bg-transparent'"
>
  <nav class="mx-auto flex h-18 max-w-7xl items-center justify-between px-5 sm:h-20">
    <a href="#top" class="group flex items-center gap-2.5">
      <span
        class="flex h-9 w-9 items-center justify-center overflow-hidden rounded-xl shadow-lg shadow-violet-600/30 transition-transform duration-300 group-hover:scale-105"
      >
        <img src="logoMusic.png" alt="{{ nickname }}" class="h-full w-full object-cover" />
      </span>
      <span class="font-display text-base font-semibold tracking-tight text-white">
        {{ nickname }}<span class="text-violet-400"></span>
      </span>
    </a>

    <div class="hidden items-center gap-1 rounded-full border border-white/5 px-1.5 py-1.5 md:flex">
      @for (link of links; track link.href) {
        <a
          [href]="link.href"
          class="rounded-full px-4 py-1.5 text-sm font-medium text-white/60 transition-colors duration-200 hover:bg-white/5 hover:text-white"
        >{{ i18n.t(link.vi, link.en) }}</a>
      }
    </div>

    <div class="hidden items-center gap-3 md:flex">
      <button
        type="button"
        (click)="i18n.toggle()"
        aria-label="Translate"
        class="flex items-center gap-1.5 rounded-full border border-white/10 bg-white/[0.03] px-3 py-2 text-xs font-semibold text-white/70 transition-colors hover:border-violet-400/30 hover:text-white"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/>
        </svg>
        {{ i18n.lang() === 'vi' ? 'EN' : 'VI' }}
      </button>

      <a
        href="#contact"
        class="inline-flex items-center gap-1.5 rounded-full bg-linear-to-r from-violet-600 to-fuchsia-600 px-4 py-2 text-sm font-semibold text-white shadow-lg shadow-violet-600/25 transition-transform duration-200 hover:-translate-y-0.5"
      >
        {{ i18n.t('Kết nối', 'Connect') }}
      </a>
    </div>

    <div class="flex items-center gap-2 md:hidden">
      <button
        type="button"
        (click)="i18n.toggle()"
        aria-label="Translate"
        class="flex h-10 items-center gap-1 rounded-lg border border-white/10 px-2.5 text-xs font-semibold text-white/80"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/>
        </svg>
        {{ i18n.lang() === 'vi' ? 'EN' : 'VI' }}
      </button>

      <button
        type="button"
        (click)="toggleMenu()"
        aria-label="Menu"
        class="flex h-10 w-10 items-center justify-center rounded-lg border border-white/10 text-white/80"
      >
        @if (menuOpen()) {
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        }
      </button>
    </div>
  </nav>

  @if (menuOpen()) {
    <div class="border-t border-white/5 bg-bg/95 px-5 py-4 backdrop-blur-xl md:hidden">
      <div class="flex flex-col gap-1">
        @for (link of links; track link.href) {
          <a
            [href]="link.href"
            (click)="closeMenu()"
            class="rounded-lg px-3 py-2.5 text-sm font-medium text-white/70 transition-colors hover:bg-white/5 hover:text-white"
          >{{ i18n.t(link.vi, link.en) }}</a>
        }
      </div>
    </div>
  }
</header>
